<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Calendar - PremierVenue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/styles.css?v=3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .venue-calendar.client-calendar .calendar-day {
            position: relative;
            overflow: visible;
        }

        .venue-calendar.client-calendar .calendar-day.has-bookings {
            background: #ffffff;
            color: #212529;
            border: 1px solid #dee2e6;
        }

        .venue-calendar.client-calendar .calendar-day .calendar-chips {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 3px;
            z-index: 1;
            max-width: 90%;
            overflow: hidden;
        }

        .venue-calendar.client-calendar .calendar-day .booking-chip {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }

        .venue-calendar.client-calendar .calendar-day .more-chips {
            font-size: 0.65rem;
            color: #6c757d;
            margin-left: 2px;
            line-height: 1;
        }

        .venue-calendar.client-calendar .calendar-tooltip {
            max-width: 320px;
            white-space: normal;
            font-size: 0.78rem;
        }

        .venue-calendar.client-calendar .calendar-tooltip hr {
            margin: 0.35rem 0;
            border-top: 1px solid #dee2e6;
        }

        .calendar-legend.venue-legend {
            flex-wrap: wrap;
            gap: 1rem;
        }

        .calendar-legend.venue-legend .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .venue-calendar.client-calendar .calendar-day:hover {
            z-index: 20 !important;
        }

        .venue-calendar.client-calendar .calendar-day .calendar-tooltip {
            z-index: 100;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top app-navbar">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="venues.html">Venues</a></li>
                    <li class="nav-item"><a class="nav-link" href="saved-venues.html">Saved Venues</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link active" href="calendar.html">Calendar</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                </ul>
                <button class="btn btn-outline-light" data-action="logout">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container py-5 mt-5">
        <h1>My Booking Calendar</h1>
        <p class="text-muted">View your requested booking dates by venue. Hover a day to see all your bookings.</p>

        <div class="card">
            <div class="card-body">
                <div id="clientCalendar" class="venue-calendar client-calendar">
                    <!-- Calendar will be dynamically generated -->
                </div>
                <div id="venueLegend" class="calendar-legend venue-legend mt-3">
                    <!-- Venue colour legend will be dynamically generated -->
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/shared/api-config.js"></script>
    <script src="../../assets/js/shared/api.js?v=3"></script>
    <script src="../../assets/js/shared/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/shared/sweetAlert-utils.js"></script>
    <script src="../../assets/js/client/pages-client-portal-calendar.js"></script>
</body>

</html>
