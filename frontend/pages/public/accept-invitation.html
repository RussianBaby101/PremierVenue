<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invitation - PremierVenue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top public-navbar">
        <div class="container">
            <a class="navbar-brand" href="../../index.html">Premier Venue</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="../../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="venues.html">Venues</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact-us.html">Contact Us</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Accept Invitation</h1>
                        <p class="text-muted" id="inviteMessage">Validating your invitation...</p>

                        <form id="acceptForm" class="d-none">
                            <div class="mb-3">
                                <label for="inviteEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="inviteEmail" readonly>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required minlength="8" autocomplete="new-password" placeholder="Create a secure password">
                                <div class="mt-2 small" id="passwordRequirements">
                                    <div data-rule="length"><i class="bi bi-x-circle text-danger me-1"></i>At least 8 characters</div>
                                    <div data-rule="uppercase"><i class="bi bi-x-circle text-danger me-1"></i>One uppercase letter</div>
                                    <div data-rule="lowercase"><i class="bi bi-x-circle text-danger me-1"></i>One lowercase letter</div>
                                    <div data-rule="digit"><i class="bi bi-x-circle text-danger me-1"></i>One number</div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="Re-enter your password">
                                <div class="small mt-1" id="matchMessage"></div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Activate Account</button>
                            </div>
                        </form>

                        <div id="successMessage" class="d-none">
                            <div class="alert alert-success">
                                Your account has been activated. You can now log in.
                            </div>
                            <a href="login.html" class="btn btn-primary w-100">Go to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../assets/js/shared/api-config.js"></script>
    <script src="../../assets/js/shared/api.js?v=3"></script>
    <script src="../../assets/js/shared/sweetAlert-utils.js"></script>
    <script src="../../assets/js/shared/main.js"></script>
    <script src="../../assets/js/public/pages-accept-invitation.js"></script>
</body>

</html>
