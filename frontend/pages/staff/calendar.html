<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Calendar - PremierVenue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/styles.css?v=3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .venue-calendar.staff-calendar .calendar-day {
            position: relative;
            overflow: visible;
        }

        .venue-calendar.staff-calendar .calendar-day.has-bookings {
            background: #ffffff;
            color: #212529;
            border: 1px solid #dee2e6;
        }

        .venue-calendar.staff-calendar .calendar-day .calendar-chips {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 3px;
            z-index: 1;
            max-width: 90%;
            overflow: hidden;
        }

        .venue-calendar.staff-calendar .calendar-day .booking-chip {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }

        .venue-calendar.staff-calendar .calendar-day .more-chips {
            font-size: 0.65rem;
            color: #6c757d;
            margin-left: 2px;
            line-height: 1;
        }

        .venue-calendar.staff-calendar .calendar-tooltip {
            max-width: 320px;
            white-space: normal;
            font-size: 0.78rem;
        }

        .venue-calendar.staff-calendar .calendar-tooltip hr {
            margin: 0.35rem 0;
            border-top: 1px solid #dee2e6;
        }

        .calendar-legend.venue-legend {
            flex-wrap: wrap;
            gap: 1rem;
        }

        .calendar-legend.venue-legend .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .venue-calendar.staff-calendar .calendar-day:hover {
            z-index: 20 !important;
        }

        .venue-calendar.staff-calendar .calendar-day .calendar-tooltip {
            z-index: 100;
        }

        /* Keep calendar event details visible on small screens by anchoring
           tooltips to the nearest safe edge instead of centering them. */
        .venue-calendar.staff-calendar .calendar-day.col-first .calendar-tooltip {
            left: 0;
            transform: translate(0, -4px);
        }

        .venue-calendar.staff-calendar .calendar-day.col-first:hover .calendar-tooltip,
        .venue-calendar.staff-calendar .calendar-day.col-first:focus .calendar-tooltip {
            transform: translate(0, 0);
        }

        .venue-calendar.staff-calendar .calendar-day.col-first .calendar-tooltip::before {
            left: 12px;
            transform: translateX(0) rotate(45deg);
        }

        .venue-calendar.staff-calendar .calendar-day.col-last .calendar-tooltip {
            left: auto;
            right: 0;
            transform: translate(0, -4px);
        }

        .venue-calendar.staff-calendar .calendar-day.col-last:hover .calendar-tooltip,
        .venue-calendar.staff-calendar .calendar-day.col-last:focus .calendar-tooltip {
            transform: translate(0, 0);
        }

        .venue-calendar.staff-calendar .calendar-day.col-last .calendar-tooltip::before {
            left: auto;
            right: 12px;
            transform: translateX(0) rotate(45deg);
        }

        .venue-calendar.staff-calendar .calendar-day.row-last .calendar-tooltip {
            top: auto;
            bottom: calc(100% + 10px);
        }

        .venue-calendar.staff-calendar .calendar-day.row-last .calendar-tooltip::before {
            top: auto;
            bottom: -6px;
            border-left: 0;
            border-top: 0;
            border-right: 1px solid #dce8f8;
            border-bottom: 1px solid #dce8f8;
        }
    </style>
    <link rel="icon" type="image/png" href="../../assets/images/PremierVenueFavicon.png">
</head>

            </button>

                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>

                    <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>

                </ul>
                <button class="btn btn-outline-light" data-action="logout">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container py-5 mt-5">
        <div class="staff-page-header d-flex justify-content-between align-items-center mb-4">
            <div>
                <p class="section-eyebrow mb-2">Admin overview</p>
                <h1>All Bookings Calendar</h1>
                <p class="text-muted mb-0">Every booking across all venues. Hover a day to see which venues are booked.
                </p>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div id="staffCalendar" class="venue-calendar staff-calendar">
                    <!-- Calendar will be dynamically generated -->
                </div>
                <div id="venueLegend" class="calendar-legend venue-legend mt-3">
                    <!-- Venue colour legend will be dynamically generated -->
                </div>
            </div>
        </div>
    </main>
